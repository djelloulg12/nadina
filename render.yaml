# =====================================================================
#  Render Blueprint — المنصة الشاملة
# =====================================================================
#  الاستخدام: ارفع هذا الملف إلى مستودع GitHub، ثم في Render اختر
#  "New -> Blueprint" وأشر إلى المستودع. Render يقرأ الملف فينشئ
#  خدمة النشر وقاعدة البيانات ويربطهما بمتغيرات البيئة.
#
#  الرابط الناتج: https://nadina.onrender.com
#
#  ملاحظة: Render يولّد قيمة SECRET_KEY تلقائياً عند أول إنشاء لأن
#  السطر يستخدم generateValue. لا تضع قيمة سرّية هنا أبداً.
#
#  ⚠️ قاعدة البيانات هنا من Render المجانية، وتنتهي بعد 30 يوماً.
#     للاستمرار بلا تاريخ انتهاء، استبدلها بـ Neon المجاني الدائم:
#     أنشئ مشروعاً على neon.com، انسخ رابط الاتصال، واحذف كتلة
#     databases كاملة واستبدل DATABASE_URL بهذا الرابط.
#     راجع DEPLOY.md القسم المعنون "الانتقال إلى Neon".
# =====================================================================

databases:
  - name: nadina-db
    databaseName: sports_clubs
    user: nadina
    # حجم صغير كافٍ للخطة المجانية (1 غيغابايت)
    plan: free

services:
  - type: web
    name: nadina
    runtime: docker
    plan: free
    region: frankfurt          # أقرب منطقة للمستخدم العربي
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health

    # رابط Render يمرّ عبر وكيل عكسي ويتصل بخادم Render داخلياً.
    # fromDatabase يولّد الرابط دون كتابة كلمة المرور في الملف.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nadina-db
          property: connectionString

      - key: DB_DRIVER
        value: postgresql

      # --- هوية المنصة ---
      - key: APP_NAME
        value: المنصة الشاملة

      - key: APP_DESIGNER
        value: جلول قندوز

      - key: APP_TAGLINE
        value: الإدارة الشاملة للنوادي الرياضية

      # --- الأمان ---
      # يُولَّد تلقائياً عند أول نشر
      - key: SECRET_KEY
        generateValue: true

      - key: APP_ENV
        value: production

      - key: DEBUG
        value: "false"

      # Render يقدّم HTTPS، فالكوكي آمن ويُرسَل فعلاً.
      # ALLOW_INSECURE_COOKIES يبقى false عمداً: لا داعي للقبض
      # الرخيص خلف TLS حقيقي.
      - key: COOKIE_SECURE
        value: "true"

      - key: ALLOW_INSECURE_COOKIES
        value: "false"

      # نطاقات مقبولة في ترويسة Host (تمنع Host header injection)
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"

      # --- سلوك التطبيق ---
      - key: APP_URL
        value: "https://nadina.onrender.com"

      # لا زرع بيانات تجريبية فوق بيانات حقيقية. لتعبئة قاعدة فارغة
      # مرة واحدة: غيّرها إلى true، انشر، ثم أعِدها false.
      - key: SEED_ON_EMPTY
        value: "false"

      - key: ALLOW_PUBLIC_CLUB_REGISTRATION
        value: "true"

      - key: SCHEDULER_ENABLED
        value: "false"
