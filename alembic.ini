[alembic]
# عنوان السكربتات
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# رابط قاعدة البيانات يُقرأ من app.core.config عند التشغيل
# (لا نثبّته هنا حتى تبقى بيئة الإنتاج هي المصدر الوحيد للحقيقة)

[post_write_hooks]
# تنسيق تلقائي بعد كل ترحيل (اختياري)
# hooks = ruff
# ruff.type = exec
# ruff.executable = python -m ruff

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S